<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">AdaptiveQueue scheduling flow</title>
<desc id="desc">Synthetic ready jobs are summarized into a queue state. Tabular Q-Learning selects FIFO, SPT, EDF, or Priority; the selected rule picks one job for a non-preemptive worker. Completion cost supplies a learning reward.</desc>
<rect x="1" y="1" width="958" height="478" rx="16" fill="#171D24" stroke="#29333E"/>
<text x="36" y="51" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" text-anchor="start">AdaptiveQueue scheduling flow</text>
<text x="924" y="49" fill="#C49A72" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" text-anchor="end">SIMULATION</text>
<text x="38" y="85" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="start">Discrete-time jobs · tabular Q-Learning</text>
<line x1="36.00" y1="104.00" x2="924.00" y2="104.00" stroke="#29333E" stroke-width="1.5" />
<defs><marker id="aq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#C49A72"/></marker></defs>
<path d="M 300 265 H 354" fill="none" stroke="#C49A72" stroke-width="2.5" marker-end="url(#aq-arrow)"/>
<path d="M 626 265 H 680" fill="none" stroke="#C49A72" stroke-width="2.5" marker-end="url(#aq-arrow)"/>
<rect x="40" y="145" width="260" height="238" rx="12" fill="#29333E" stroke="#71818B" stroke-width="1.5"/>
<rect x="356" y="145" width="270" height="238" rx="12" fill="#29333E" stroke="#C49A72" stroke-width="1.5"/>
<rect x="680" y="145" width="242" height="238" rx="12" fill="#29333E" stroke="#71818B" stroke-width="1.5"/>
<text x="170" y="188" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="28" font-weight="600" text-anchor="middle">Ready job queue</text>
<text x="170" y="232" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">Arrival + deadlines</text>
<text x="170" y="270" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">Duration + priority</text>
<text x="170" y="338" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="26" font-weight="600" text-anchor="middle">State features</text>
<text x="491" y="188" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="28" font-weight="600" text-anchor="middle">Q-Learning</text>
<text x="491" y="232" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">Choose a rule</text>
<text x="491" y="274" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="25" font-weight="600" text-anchor="middle">FIFO · SPT</text>
<text x="491" y="308" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="25" font-weight="600" text-anchor="middle">EDF · Priority</text>
<text x="491" y="350" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">96 state buckets</text>
<text x="801" y="188" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="28" font-weight="600" text-anchor="middle">Single worker</text>
<text x="801" y="232" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">Non-preemptive</text>
<text x="801" y="270" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="23" font-weight="400" text-anchor="middle">Finish one job</text>
<text x="801" y="338" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" text-anchor="middle">Cost → reward</text>
<text x="40" y="432" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="25" font-weight="400" text-anchor="start">State-dependent selection of classical scheduling rules.</text>
<text x="40" y="469" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="start">Benchmarked on Stable, Bursty, and Mixed synthetic workloads.</text>
</svg>

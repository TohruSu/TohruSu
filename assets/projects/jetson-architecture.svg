<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">Multimodal event flow</title>
<desc id="desc">Video and pose generate fall events and person ROIs. Optional relative depth adds context; speech supplies help keywords. Fusion supplies alerts to PyQt5, which also displays frames, depth, and health. This is an architecture illustration, not a hardware result.</desc>

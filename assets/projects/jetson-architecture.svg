<text x="924" y="49" fill="#C49A72" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" text-anchor="end">ARCHITECTURE</text>
<text x="38" y="85" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="start">Documented application design · not a screenshot</text>

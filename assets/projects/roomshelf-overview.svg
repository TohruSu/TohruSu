<text x="180" y="182" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="28" font-weight="600" text-anchor="middle">React catalog</text>
<text x="180" y="220" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="middle">Search + filters</text>
<text x="180" y="252" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="middle">Sort + page in URL</text>
<line x1="60.00" y1="273.00" x2="300.00" y2="273.00" stroke="#71818B" stroke-width="1.5" />
<text x="180" y="310" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="26" font-weight="600" text-anchor="middle">Compare up to 3</text>
<text x="180" y="345" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="middle">Browser memory</text>
<text x="497" y="182" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="28" font-weight="600" text-anchor="middle">Flask API</text>
<text x="497" y="220" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="middle">Catalog reads</text>

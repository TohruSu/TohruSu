<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">RoomShelf application flow</title>
<desc id="desc">React keeps catalog search, filters, sorting, and pagination in the URL, and comparison selections for up to three products in browser memory. Flask serves catalog reads and shortlist writes, with signed sessions and CSRF and Origin checks for mutations. SQLite stores products, anonymous sessions, and shortlist items. Architecture illustration, not an application screenshot.</desc>
<rect x="1" y="1" width="958" height="478" rx="16" fill="#171D24" stroke="#29333E"/>
<text x="36" y="51" fill="#F0ECE5" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="34" font-weight="700" text-anchor="start">RoomShelf application flow</text>
<text x="924" y="49" fill="#C49A72" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="600" text-anchor="end">ARCHITECTURE</text>
<text x="38" y="85" fill="#AAB5BD" font-family="ui-sans-serif, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" text-anchor="start">React catalog · Flask API · SQLite persistence</text>
<line x1="36.00" y1="104.00" x2="924.00" y2="104.00" stroke="#29333E" stroke-width="1.5" />
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="#C49A72"/></marker></defs>
<path d="M 320 236 H 374" fill="none" stroke="#C49A72" stroke-width="2.5" marker-end="url(#arrow)"/>

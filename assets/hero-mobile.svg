<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
  <title id="title">Tohru — software, systems, and applied AI</title>
  <desc id="desc">The compact version of Tohru's navy instrument panel, with a decorative cyan-to-violet signal trace.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101d31"/>
      <stop offset="1" stop-color="#111321"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#b7a2ff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="238" rx="18" fill="url(#panel)" stroke="#35415a"/>
  <path d="M 25 49 H 455" stroke="#35415a"/>
